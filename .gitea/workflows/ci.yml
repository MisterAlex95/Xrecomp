# Linux baseline of the fork (XBA-13): the toolkit builds, every C test project under tests/ passes or skips
# (exit 77), and the Python suite (pytest tools/) passes -- all inside tools/docker/linux.Dockerfile.
# Runs on the Coolify host's Docker (job container with the Docker CLI only), like Table Factory's CI; the host's
# layer cache keeps the apt / pip layers between runs. The last step prints the C test report.
#
# Gating (XBA-53, docs/android/toolchain.md « CI gating »):
#   pull request   linux, then android-toolkit (NDK compile) when the PR touches what the toolkit is built from
#   push to main   linux, then linux-arm64 (fails on a failure not in tools/ci/arm64-expected.txt), then android-image
#   weekly         linux, then device-tests (the device test bundle; fails when a project stops building)
# Heavy jobs (everything but linux) take tools/ci/heavy_lock.sh: one at a time on the shared host, queued, never
# cancelled. Gitea's `concurrency:` keeps one pending job per group and cancels the others, hence the lock.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore: ['.claude/**', 'CLAUDE.md']
  schedule:
    - cron: '30 2 * * 1'   # Monday night: device-tests
  workflow_dispatch:
    inputs:
      device_tests:
        description: 'Also build the device test bundle (device-tests job, about 12 min)'
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    runs-on: ubuntu-latest
    container:
      image: docker:29.8.1-cli
    env:
      # per-run tag: runs share the host's Docker, so a run's cleanup never removes another run's image
      TEST_TAG: xba-linux:${{ github.run_id }}
    steps:
      # By hand: there is no Node in this image for actions/checkout.
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache git >/dev/null
          git init -q .
          git fetch -q --depth 1 "$(printf '%s' "$GITHUB_SERVER_URL" | sed "s#://#://ci:$TOKEN@#")/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD
          git log -1 --format='%h %s'

      - name: Build and test (Docker)
        run: docker build -f tools/docker/linux.Dockerfile --target test --progress=plain -t "$TEST_TAG" .

      # On a failure the per-project lines are in the build log above.
      - name: C test report
        run: docker run --rm "$TEST_TAG" cat /reports/c-tests.md

      - name: Clean up
        if: always()
        run: docker rmi "$TEST_TAG" >/dev/null 2>&1 || true

  # XBA-53: a PR that breaks the NDK build goes red before the merge. The toolkit target of android.Dockerfile
  # (compile only, JOBS=4, after linux, under the heavy-job lock), only when the PR touches what it is built from;
  # other PRs pass through in seconds. The Android image layers are cached on the host: a few minutes.
  android-toolkit:
    needs: linux
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: docker:29.8.1-cli
    env:
      IMAGE_TAG: xba-android-pr:${{ github.run_id }}
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache git >/dev/null
          git init -q .
          git fetch -q --depth 1 "$(printf '%s' "$GITHUB_SERVER_URL" | sed "s#://#://ci:$TOKEN@#")/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      # The PR's files, from the merge base (Gitea puts it in the event). A cheap step: two depth-1 fetches and a
      # tree diff. If the merge base cannot be had, the compile runs (better a few minutes than a miss).
      - name: Does the PR touch the Android build?
        id: paths
        env:
          TOKEN: ${{ github.token }}
          MERGE_BASE: ${{ github.event.pull_request.merge_base }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          url="$(printf '%s' "$GITHUB_SERVER_URL" | sed "s#://#://ci:$TOKEN@#")/$GITHUB_REPOSITORY.git"
          base=${MERGE_BASE:-$BASE_SHA}
          if [ -n "$base" ] && git fetch -q --depth 1 "$url" "$base" 2>/dev/null \
             && files=$(git diff --name-only "$base" HEAD); then
            echo "Changed since $(printf '%.8s' "$base"):"; printf '%s\n' "$files" | sed 's/^/  /'
            if printf '%s\n' "$files" | grep -qE '^(src/|include/|android/|cmake/|CMakeLists\.txt$|tools/docker/android\.Dockerfile$|\.gitea/workflows/ci\.yml$)'; then
              echo "android=true" >> "$GITHUB_OUTPUT"
            else
              echo "Nothing the Android toolkit is built from: compile skipped."
              echo "android=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No merge base to diff against: compiling anyway."
            echo "android=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the heavy-job lock
        if: steps.paths.outputs.android == 'true'
        run: sh tools/ci/heavy_lock.sh acquire

      - name: Toolkit for arm64-v8a (NDK, API 30)
        if: steps.paths.outputs.android == 'true'
        run: |
          docker build -f tools/docker/android.Dockerfile --target toolkit --build-arg JOBS=4 --progress=plain \
            -t "$IMAGE_TAG" .
          docker run --rm "$IMAGE_TAG" cat /reports/android-artefacts.txt

      - name: Clean up
        if: always()
        run: |
          docker rmi "$IMAGE_TAG" >/dev/null 2>&1 || true
          sh tools/ci/heavy_lock.sh release || true

  # arm64: cross-compiled, tests under qemu-user (docs/android/baseline-arm64.md). A build break fails the job, and
  # so does a test failure that is not in tools/ci/arm64-expected.txt, or a line there that no longer fails (XBA-53):
  # the Docker build prints the report and runs tools/ci/check_expected.py.
  #
  # The qemu and Android SDK jobs run only on pushes to main or by hand, chained, and under the heavy-job lock across
  # runs: on 2026-11-09 the first PR running them in parallel saturated the shared Proxmox storage (Gitea and Plane
  # stopped answering). On PRs only the toolkit compile runs (android-toolkit).
  linux-arm64:
    needs: linux
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    container:
      image: docker:29.8.1-cli
    env:
      TEST_TAG: xba-linux-arm64:${{ github.run_id }}
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache git >/dev/null
          git init -q .
          git fetch -q --depth 1 "$(printf '%s' "$GITHUB_SERVER_URL" | sed "s#://#://ci:$TOKEN@#")/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      # One heavy job at a time on the shared host (XBA-53): waits here, never cancelled.
      - name: Wait for the heavy-job lock
        run: sh tools/ci/heavy_lock.sh acquire

      - name: Cross-build and test under qemu (Docker)
        run: docker build -f tools/docker/linux-arm64.Dockerfile --target test --progress=plain -t "$TEST_TAG" .

      - name: arm64 C test report
        run: docker run --rm "$TEST_TAG" cat /reports/c-tests.md

      - name: Clean up
        if: always()
        run: |
          docker rmi "$TEST_TAG" >/dev/null 2>&1 || true
          sh tools/ci/heavy_lock.sh release || true

  # The Android toolchain image (docs/android/toolchain.md) builds, and its NDK builds SDL2 for arm64-v8a / API 30.
  android-image:
    needs: linux-arm64
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    container:
      image: docker:29.8.1-cli
    env:
      IMAGE_TAG: xba-android:${{ github.run_id }}
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache git >/dev/null
          git init -q .
          git fetch -q --depth 1 "$(printf '%s' "$GITHUB_SERVER_URL" | sed "s#://#://ci:$TOKEN@#")/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      # One heavy job at a time on the shared host (XBA-53): waits here, never cancelled.
      - name: Wait for the heavy-job lock
        run: sh tools/ci/heavy_lock.sh acquire

      - name: Build the image
        run: docker build -f tools/docker/android.Dockerfile --target android --progress=plain -t "$IMAGE_TAG" .

      - name: Smoke test (SDL2 for arm64-v8a, API 30)
        run: |
          docker run --rm "$IMAGE_TAG" bash -c '
            cat /etc/xba-toolchain.txt
            cmake -S "$SDL2_SRC" -B /tmp/sdl -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=30 >/dev/null
            cmake --build /tmp/sdl -j4 >/dev/null
            file /tmp/sdl/libSDL2.so | tee /dev/stderr | grep -q "ARM aarch64, version 1 (SYSV), dynamically linked, for Android 30"'

      # XBA-17: every toolkit library builds for arm64-v8a, SDL2 from the pinned sources, no desktop dependency.
      - name: Toolkit for arm64-v8a (NDK, API 30)
        run: |
          docker build -f tools/docker/android.Dockerfile --target toolkit --progress=plain -t "$IMAGE_TAG-toolkit" .
          docker run --rm "$IMAGE_TAG-toolkit" cat /reports/android-artefacts.txt

      # XBA-18: the app shell APK (debug-signed; no game code in it).
      - name: App shell APK
        run: |
          docker build -f tools/docker/android.Dockerfile --target apk --build-arg XBA_VERSION="${GITHUB_SHA:0:8}" \
            --progress=plain -t "$IMAGE_TAG-apk" .
          docker run --rm "$IMAGE_TAG-apk" cat /out/apk-contents.txt
          mkdir -p out && cid=$(docker create "$IMAGE_TAG-apk") && docker cp "$cid:/out/xboxrecomp-shell.apk" out/ \
            && docker rm "$cid" >/dev/null && ls -la out

      # XBA-20: the shell APK of the latest main, as the rolling prerelease « shell-latest » (one at a time).
      # No game content anywhere: the repo, the image and this job only ever hold the toolkit and the shell.
      - name: Publish the shell APK (shell-latest)
        env:
          TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache curl jq >/dev/null
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          auth="Authorization: token $TOKEN"
          sha8=$(printf '%s' "$GITHUB_SHA" | cut -c1-8)
          old=$(curl -fsS -H "$auth" "$api/releases/tags/shell-latest" 2>/dev/null | jq -r '.id // empty' || true)
          if [ -n "$old" ]; then
            curl -fsS -X DELETE -H "$auth" "$api/releases/$old"
            curl -fsS -X DELETE -H "$auth" "$api/tags/shell-latest" || true
          fi
          body=$(jq -n --arg sha "$GITHUB_SHA" --arg s "$sha8" \
            '{tag_name: "shell-latest", target_commitish: $sha, name: ("App shell, latest main (" + $s + ")"), prerelease: true,
              body: ("The Android app shell built by CI from main at " + $s + ". No game inside. Debug-signed, arm64-v8a, Android 11+.\n\nInstall: adb install -r xboxrecomp-shell-" + $s + ".apk. Check list: docs/android/app-shell.md.")}')
          id=$(curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" -d "$body" "$api/releases" | jq -r .id)
          curl -fsS -X POST -H "$auth" -F "attachment=@out/xboxrecomp-shell.apk;type=application/vnd.android.package-archive" \
            "$api/releases/$id/assets?name=xboxrecomp-shell-$sha8.apk" | jq -r .browser_download_url

      # XBA-52: the stub title (templates/new-game around the synthetic XBE of tools/conformance, lifted by the
      # pipeline) linked into the shell: the first end-to-end link of generated C for Android. Its APK and the
      # synthetic XBE (ours, no game content) go next to the shell APK in « shell-latest », for the device check.
      - name: Stub title APK
        env:
          TOKEN: ${{ github.token }}
        run: |
          trap 'docker rmi "$IMAGE_TAG-stub" >/dev/null 2>&1 || true; rm -rf out-stub' EXIT
          docker build -f tools/docker/android.Dockerfile --target stub-apk --build-arg XBA_VERSION="${GITHUB_SHA:0:8}" \
            --progress=plain -t "$IMAGE_TAG-stub" .
          docker run --rm "$IMAGE_TAG-stub" cat /out/stub-apk-contents.txt
          mkdir -p out-stub && cid=$(docker create "$IMAGE_TAG-stub") \
            && docker cp "$cid:/out/xboxrecomp-stub.apk" out-stub/ && docker cp "$cid:/out/stub-default.xbe" out-stub/ \
            && docker rm "$cid" >/dev/null
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          auth="Authorization: token $TOKEN"
          sha8=$(printf '%s' "$GITHUB_SHA" | cut -c1-8)
          id=$(curl -fsS -H "$auth" "$api/releases/tags/shell-latest" | jq -r .id)
          curl -fsS -X POST -H "$auth" -F "attachment=@out-stub/xboxrecomp-stub.apk;type=application/vnd.android.package-archive" \
            "$api/releases/$id/assets?name=xboxrecomp-stub-$sha8.apk" | jq -r .browser_download_url
          curl -fsS -X POST -H "$auth" -F "attachment=@out-stub/stub-default.xbe;type=application/octet-stream" \
            "$api/releases/$id/assets?name=stub-default.xbe" | jq -r .browser_download_url

      - name: Clean up
        if: always()
        run: |
          docker rmi "$IMAGE_TAG" "$IMAGE_TAG-toolkit" "$IMAGE_TAG-apk" >/dev/null 2>&1 || true
          rm -rf out
          sh tools/ci/heavy_lock.sh release || true

  # XBA-53: the device test bundle (XBA-19) still builds. Weekly at night, or by hand with device_tests ticked;
  # about 12 minutes (every project rebuilds the toolkit). build-report.md says which projects were built for
  # Android; tools/ci/check_expected.py fails the run when one that is not in tools/ci/android-unbuilt.txt was not,
  # or when a listed one builds again. The bundle itself stays in the image (no game content in it either).
  device-tests:
    needs: linux
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.device_tests == 'true')
    runs-on: ubuntu-latest
    container:
      image: docker:29.8.1-cli
    env:
      IMAGE_TAG: xba-device-tests:${{ github.run_id }}
    steps:
      - name: Checkout
        env:
          TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache git >/dev/null
          git init -q .
          git fetch -q --depth 1 "$(printf '%s' "$GITHUB_SERVER_URL" | sed "s#://#://ci:$TOKEN@#")/$GITHUB_REPOSITORY.git" "$GITHUB_SHA"
          git checkout -q FETCH_HEAD

      # One heavy job at a time on the shared host (XBA-53): waits here, never cancelled.
      - name: Wait for the heavy-job lock
        run: sh tools/ci/heavy_lock.sh acquire

      - name: Device test bundle (NDK, API 30)
        run: |
          docker build -f tools/docker/android.Dockerfile --target device-tests --build-arg JOBS=4 --progress=plain \
            -t "$IMAGE_TAG" .

      - name: Build report, against tools/ci/android-unbuilt.txt
        run: |
          docker run --rm "$IMAGE_TAG" cat /out/build-report.md
          docker run --rm "$IMAGE_TAG" ls -la /out
          docker run --rm -w /src "$IMAGE_TAG" python3 tools/ci/check_expected.py android \
            --expected tools/ci/android-unbuilt.txt --report /out/build-report.md

      - name: Clean up
        if: always()
        run: |
          docker rmi "$IMAGE_TAG" >/dev/null 2>&1 || true
          sh tools/ci/heavy_lock.sh release || true
