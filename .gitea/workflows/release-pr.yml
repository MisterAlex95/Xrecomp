# The release PR (docs/releases/README.md « Making a release »), in the spirit of release-please: after each push to
# main, tools/release/release.py works out the next version from the commits since the last xrecomp-v* tag (trailer
# `Release: major|minor|patch|none`, none given = patch) and keeps one open pull request, branch release/next, that
# adds docs/releases/xrecomp-v<next>.md (a generated « Changes » section) and its row in the README table.
# Whatever is written by hand above « Changes » on release/next survives the next update, even when the version moves.
# Merging that PR into main makes release.yml tag the merge commit and publish the release.
# Light job: Python and git only, no heavy-job lock.
name: Release PR

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-pr
  cancel-in-progress: true

jobs:
  release-pr:
    runs-on: ubuntu-latest
    container:
      image: docker:29.8.1-cli
    steps:
      - name: Update the release PR
        env:
          TOKEN: ${{ github.token }}
        run: |
          apk add --no-cache git curl jq python3 >/dev/null
          remote=$(printf '%s' "$GITHUB_SERVER_URL" | sed "s#://#://ci:$TOKEN@#")/$GITHUB_REPOSITORY.git
          api="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY"
          auth="Authorization: token $TOKEN"
          git init -q . && git remote add origin "$remote"
          git fetch -q --tags origin "+$GITHUB_SHA:refs/remotes/origin/main"
          git checkout -q -B release/next origin/main
          git config user.name "XRecomp CI" && git config user.email "ci@xrecomp.invalid"
          # The merged release PR itself: release.yml tags it, nothing is left to propose.
          if git rev-parse -q --verify HEAD^1 >/dev/null && [ -n "$(python3 tools/release/release.py pending HEAD^1 HEAD)" ]; then
            echo "this push merged a release: release.yml tags it"; exit 0
          fi
          carry=
          if git fetch -q origin "+release/next:refs/remotes/origin/release/next" 2>/dev/null; then
            f=$(git diff --name-only --diff-filter=A origin/main origin/release/next -- 'docs/releases/xrecomp-v*.md' | head -n1)
            if [ -n "$f" ]; then carry=$(mktemp) && git show "origin/release/next:$f" > "$carry"; fi
          fi
          out=$(python3 tools/release/release.py prepare ${carry:+--carry "$carry"})
          pr=$(curl -fsS -H "$auth" "$api/pulls?state=open&limit=50" \
                 | jq -r '[.[] | select(.head.ref == "release/next")][0].number // empty')
          if [ -z "$out" ]; then
            echo "nothing to release since the last tag"
            [ -z "$pr" ] || curl -fsS -X PATCH -H "$auth" -H "Content-Type: application/json" \
              -d '{"state":"closed"}' "$api/pulls/$pr" >/dev/null
            exit 0
          fi
          set -- $out; version=$1 bump=$2
          git add docs/releases
          git commit -q -m "Release: XRecomp $version"
          git push -q -f origin release/next
          title="Release: XRecomp $version"
          body=$(jq -n --arg v "$version" --arg b "$bump" --arg sha "$(git rev-parse --short=8 origin/main)" '{body: (
            "Next release: **" + $v + "** (" + $b + " bump), from main at " + $sha + ".\n\n" +
            "- Edit `docs/releases/xrecomp-v" + $v + ".md` on this branch: write the highlights above « Changes »; " +
            "that section is regenerated on every push to main, the rest is kept.\n" +
            "- The version comes from the commits: a `Release: minor` (or `major`, `patch`, `none`) trailer, " +
            "none given = patch. A finished roadmap milestone = push a commit with `Release: minor`.\n" +
            "- Merge this PR into main: CI tags `xrecomp-v" + $v + "` and publishes the release " +
            "(docs/releases/README.md).\n\n🤖 Generated by .gitea/workflows/release-pr.yml")}')
          if [ -n "$pr" ]; then
            printf '%s' "$body" | jq --arg t "$title" '. + {title: $t}' \
              | curl -fsS -X PATCH -H "$auth" -H "Content-Type: application/json" -d @- "$api/pulls/$pr" >/dev/null
            echo "updated PR #$pr: $title"
          else
            printf '%s' "$body" | jq --arg t "$title" '. + {title: $t, head: "release/next", base: "main"}' \
              | curl -fsS -X POST -H "$auth" -H "Content-Type: application/json" -d @- "$api/pulls" | jq -r '"opened PR #\(.number): \(.title)"'
          fi
