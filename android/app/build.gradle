// One APK per title: the title's build passes its own applicationId and label (-PxbaApplicationId=..., -PxbaLabel=...),
// its project (-PxbaTitleDir=...) and its icon (-PxbaIconRes=...); tools/android/title_apk.sh fills them all in.
// SDL2's Java side (org.libsdl.app) is compiled from the pinned SDL2 sources, not copied into this repo.
plugins {
    id 'com.android.application'
}

def sdl2Src = System.getenv('SDL2_SRC') ?: findProperty('sdl2Src')
if (!sdl2Src) throw new GradleException('Set SDL2_SRC (or -Psdl2Src=...) to the SDL2 sources (release-2.32.10)')
def xbaVersion = findProperty('xbaVersion') ?: 'dev'
// Frame generation (docs/technical/framegen.md, XBA-187): on by default. The toolkit's XBOXRECOMP_LSFG (pacer, shader
// cache, Vulkan bridge) goes into libmain.so and the DXBC translator into libxba_import.so, over pinned sources that
// CMake fetches (src/framegen/lsfg_sources.cmake: GameNative/lsfg-vk-android d33caceb with volk, DXVK v2.6.2 with
// SPIRV-Headers; kept in third_party/lsfg-sources or $XBOXRECOMP_DEPS_DIR) unless LSFG_VK_SRC / -PlsfgVkSrc=... and
// DXVK_SRC / -PdxvkSrc=... name checkouts. -PxbaLsfg=0 leaves it out (offline builds).
def xbaLsfg = ((findProperty('xbaLsfg') ?: '1') as String) != '0'
def lsfgVkSrc = xbaLsfg ? ((findProperty('lsfgVkSrc') ?: System.getenv('LSFG_VK_SRC') ?: '') as String) : ''
def dxvkSrc = xbaLsfg ? ((findProperty('dxvkSrc') ?: System.getenv('DXVK_SRC') ?: '') as String) : ''
// A title linked into libmain.so (XBA-52): its project directory, a copy of templates/new-game with its generated C.
def xbaTitleDir = findProperty('xbaTitleDir') ?: ''
// The SHA-256 of the default.xbe a title's APK is built for (XBA-54, XBA-40): the game picker refuses another disc
// (WRONG_GAME). Empty (the shell, the stub) = no check.
def xbaXbeSha256 = ((findProperty('xbaXbeSha256') ?: '') as String).trim().toLowerCase()
if (xbaXbeSha256 && !(xbaXbeSha256 ==~ /[0-9a-f]{64}/))
    throw new GradleException("-PxbaXbeSha256=${xbaXbeSha256}: expected 64 hex digits (sha256sum default.xbe)")

// A title's own icon (docs/android/app-shell.md « A title's own APK »): -PxbaIconRes=DIR, the res/ tree that
// `python -m tools.title_art SOURCE --android-res DIR` makes from the player's default.xbe (tools/android/title_apk.sh
// does both). It defines mipmap/ic_launcher again, so it goes into the build types' source sets, which override main's.
// It comes from the game: it lives outside the repository, like the title's generated C.
def xbaIconRes = ((findProperty('xbaIconRes') ?: '') as String).trim()
if (xbaIconRes && !new File(xbaIconRes, 'mipmap-anydpi-v26/ic_launcher.xml').isFile())
    throw new GradleException("-PxbaIconRes=${xbaIconRes}: no mipmap-anydpi-v26/ic_launcher.xml " +
                              '(python -m tools.title_art SOURCE --android-res DIR)')

// The synthetic XBE of tools/conformance (ours: five leaf functions, no game content) as the asset selftest.xbe, for
// the in-app self-test (XBA-51, RECOMP_SHELL_SELFTEST=1). Copied at build time rather than kept twice in the repo.
abstract class XbaSelftestAsset extends DefaultTask {
    @InputFile abstract RegularFileProperty getXbe()
    @OutputDirectory abstract DirectoryProperty getOutputDir()
    @TaskAction void copy() {
        def dir = outputDir.get().asFile
        dir.mkdirs()
        java.nio.file.Files.copy(xbe.get().asFile.toPath(), new File(dir, 'selftest.xbe').toPath(),
                                 java.nio.file.StandardCopyOption.REPLACE_EXISTING)
    }
}
def selftestAsset = tasks.register('xbaSelftestAsset', XbaSelftestAsset) {
    xbe = rootProject.file('../tools/conformance/test.xbe')
}
// The licences the APK must carry (NOTICE « The Android app »): LICENSE, NOTICE and LICENSES/*.txt as assets
// licences/, which About > Licences shows. Copied at build time, never kept twice in the repo.
abstract class XbaLicencesAsset extends DefaultTask {
    @InputFiles @PathSensitive(PathSensitivity.NAME_ONLY) abstract ConfigurableFileCollection getTexts()
    @OutputDirectory abstract DirectoryProperty getOutputDir()
    @TaskAction void copy() {
        def dir = new File(outputDir.get().asFile, 'licences')
        outputDir.get().asFile.deleteDir()
        dir.mkdirs()
        texts.files.findAll { it.isFile() }.each {
            def name = it.name.endsWith('.txt') ? it.name : it.name + '.txt'
            java.nio.file.Files.copy(it.toPath(), new File(dir, name).toPath())
        }
    }
}
// The Xbox 360 retail and devkit keys (XBA-300): only from the build's secrets (-PxbaX360Key / XBA_X360_KEY and
// -PxbaX360DevkitKey / XBA_X360_DEVKIT_KEY, 32 hex digits each), never in the repository. Without the retail key the
// player picks a key file. The values are never printed.
abstract class XbaX360KeyAsset extends DefaultTask {
    @Input abstract Property<String> getHex()
    @Input abstract Property<String> getDevkitHex()
    @OutputDirectory abstract DirectoryProperty getOutputDir()
    @TaskAction void write() {
        def dir = new File(outputDir.get().asFile, 'x360')
        outputDir.get().asFile.deleteDir()
        dir.mkdirs()
        if (hex.get()) new File(dir, 'builtin.key').bytes = hex.get().decodeHex()
        if (devkitHex.get()) new File(dir, 'builtin-devkit.key').bytes = devkitHex.get().decodeHex()
    }
}
def xbaX360Key = ((findProperty('xbaX360Key') ?: System.getenv('XBA_X360_KEY') ?: '') as String).trim()
if (xbaX360Key && !(xbaX360Key ==~ /[0-9a-fA-F]{32}/))
    throw new GradleException('XBA_X360_KEY must be 32 hex digits')
def xbaX360DevkitKey = ((findProperty('xbaX360DevkitKey') ?: System.getenv('XBA_X360_DEVKIT_KEY') ?: '') as String).trim()
if (xbaX360DevkitKey && !(xbaX360DevkitKey ==~ /[0-9a-fA-F]{32}/))
    throw new GradleException('XBA_X360_DEVKIT_KEY must be 32 hex digits')
def x360KeyAsset = xbaX360Key || xbaX360DevkitKey ? tasks.register('xbaX360KeyAsset', XbaX360KeyAsset) {
    hex = xbaX360Key
    devkitHex = xbaX360DevkitKey
} : null
def licencesAsset = tasks.register('xbaLicencesAsset', XbaLicencesAsset) {
    texts.from(rootProject.file('../LICENSE'), rootProject.file('../NOTICE'),
               fileTree(rootProject.file('../LICENSES')) { include '*.txt' })
}
// The PlayStation BIOS the app ships (XBA-168, docs/android/app-shell.md « PlayStation games »): -PxbaPs1Bios=FILE,
// OpenBIOS (MIT, pcsx-redux/nugget; licence LICENSES/MIT-OpenBIOS.txt, copied with the other licences) as built by the
// ps1-bios stage of tools/docker/android.Dockerfile or tools/consoles/build_ps1_bios.sh, checked against the pinned
// sha256, as the asset ps1-bios/openbios.bin, which the PS1 runtime reads (ps1_runtime.c, SDL_RWFromFile). Never a
// Sony BIOS. Without it the APK has none: a PS1 game then runs on the HLE BIOS (consoles/ps1/HLE_BIOS.md, XBA-163)
// unless RECOMP_PS1_BIOS (recomp.cfg) names an image.
def xbaPs1Bios = ((findProperty('xbaPs1Bios') ?: System.getenv('XBA_PS1_BIOS') ?: '') as String).trim()
def xbaPs1BiosSha256 = '68942dc22a85dd7f809d7a99043575096d95d656925dfcd3f056036e22d84085'
abstract class XbaPs1BiosAsset extends DefaultTask {
    @InputFile abstract RegularFileProperty getBios()
    @Input abstract Property<String> getSha256()
    @OutputDirectory abstract DirectoryProperty getOutputDir()
    @TaskAction void copy() {
        def src = bios.get().asFile
        def sum = java.security.MessageDigest.getInstance('SHA-256').digest(src.bytes).encodeHex().toString()
        if (sum != sha256.get())
            throw new GradleException("-PxbaPs1Bios=${src}: sha256 ${sum}, expected ${sha256.get()} (OpenBIOS as " +
                                      'tools/consoles/build_ps1_bios.sh builds it)')
        def dir = new File(outputDir.get().asFile, 'ps1-bios')
        outputDir.get().asFile.deleteDir()
        dir.mkdirs()
        java.nio.file.Files.copy(src.toPath(), new File(dir, 'openbios.bin').toPath())
    }
}
def ps1BiosAsset = null
if (xbaPs1Bios) {
    if (!new File(xbaPs1Bios).isFile())
        throw new GradleException("-PxbaPs1Bios=${xbaPs1Bios}: no such file (tools/consoles/build_ps1_bios.sh)")
    ps1BiosAsset = tasks.register('xbaPs1BiosAsset', XbaPs1BiosAsset) {
        bios = file(xbaPs1Bios)
        sha256 = xbaPs1BiosSha256
    }
} else {
    logger.info('no -PxbaPs1Bios: the APK carries no PlayStation BIOS (PS1 games run on the HLE BIOS)')
}
// The on-device toolchain of the Prepare (docs/android/toolchain.md, docs/android/prepare.md): -PxbaToolchainDir=DIR,
// made by tools/android/toolchain/ (the toolchain-out stage of tools/docker/android.Dockerfile). It adds the jniLibs
// libxbapython.so, libpython3.13.so, libcapstone.so and libxbacc.so, the assets prepare/python-stdlib.zip and
// prepare/sysroot.zip, and prepare/toolkit.zip, made here (xbaToolkitAsset: what the pipeline needs from this
// repository, zipped at build time, never copied by hand), each with its .sha256. The app (Toolchain.java) extracts
// them once per version. Without it the APK is the plain shell, as before.
def xbaToolchainDir = (findProperty('xbaToolchainDir') ?: '') as String
// tools/android/build_ffmpeg.sh's output (XBA-299): the Xbox 360's XMA decoder; without it XMA voices are silent.
def xbaFfmpegDir = (findProperty('xbaFfmpegDir') ?: System.getenv('XBA_FFMPEG_DIR') ?: '') as String
if (xbaToolchainDir) {
    def need = ['libxbapython.so', 'libpython3.13.so', 'libcapstone.so', 'libxbacc.so'].collect { "jniLibs/arm64-v8a/$it" } +
               ['python-stdlib.zip', 'sysroot.zip'].collect { "assets/prepare/$it" }
    def missing = need.findAll { !new File(xbaToolchainDir, it).isFile() }
    if (missing) throw new GradleException("-PxbaToolchainDir=${xbaToolchainDir}: missing ${missing.join(', ')}")
}

abstract class XbaToolkitAsset extends DefaultTask {
    @Input abstract Property<String> getRepoRoot()
    @InputFiles @PathSensitive(PathSensitivity.RELATIVE) abstract ConfigurableFileCollection getToolkitFiles()
    @Input abstract Property<String> getCommit()
    @OutputDirectory abstract DirectoryProperty getOutputDir()

    @TaskAction void make() {
        def dir = new File(outputDir.get().asFile, 'prepare')
        outputDir.get().asFile.deleteDir()
        dir.mkdirs()
        def root = new File(repoRoot.get()).toPath()
        def files = toolkitFiles.files.collect { [root.relativize(it.toPath()).toString().replace('\\', '/'), it] }
                                .sort { it[0] }
        // The toolkit digest (tools/prepare/toolkit.py, the same bytes): sha256 over the files in path order, each as
        // path NUL size NUL bytes. pack.json's toolkit_sha256 is compared with it (XBA-127, docs/android/prepare.md
        // « When a pack is stale »): an APK whose toolkit tree did not change keeps every pack current.
        def tk = java.security.MessageDigest.getInstance('SHA-256')
        files.each {
            byte[] data = it[1].bytes
            tk.update((it[0] + '\0' + data.length + '\0').getBytes('UTF-8'))
            tk.update(data)
        }
        def digest = tk.digest().encodeHex().toString()
        // tools/VERSION stands in for git, absent on the device (tools/prepare: toolkit_version): the commit, or
        // without git (the Docker builds) the digest.
        def id = commit.get()
        if (id == 'unknown')
            id = 'files-' + digest
        // Same inputs, same bytes: sorted entries, fixed times.
        def zip = new File(dir, 'toolkit.zip')
        new java.util.zip.ZipOutputStream(new FileOutputStream(zip)).withCloseable { out ->
            out.setLevel(9)
            def put = { String name, byte[] data ->
                def e = new java.util.zip.ZipEntry(name)
                e.setTime(315532800000L)        // 1980-01-01, the zip epoch
                out.putNextEntry(e)
                out.write(data)
                out.closeEntry()
            }
            put('tools/VERSION', "${id}\n".getBytes('UTF-8'))
            put('tools/TOOLKIT_SHA256', "${digest}\n".getBytes('UTF-8'))
            files.each { put(it[0], it[1].bytes) }
        }
        def md = java.security.MessageDigest.getInstance('SHA-256')
        zip.withInputStream { is -> byte[] b = new byte[1 << 16]; int n; while ((n = is.read(b)) > 0) md.update(b, 0, n) }
        new File(dir, 'toolkit.zip.sha256').text = "${md.digest().encodeHex()}  toolkit.zip\n"
        // The launcher reads the digest without opening the zip (Toolchain.toolkitDigest).
        new File(dir, 'toolkit.zip.id').text = "${digest}\n"
    }
}
// Release signing (XBA-125): see signingConfigs below.
def xbaKeystore = (System.getenv('XBA_KEYSTORE') ?: findProperty('xbaKeystore') ?: '') as String
def xbaKeystorePassword = (System.getenv('XBA_KEYSTORE_PASSWORD') ?: '') as String
if (xbaKeystore && !new File(xbaKeystore).isFile())
    throw new GradleException("XBA_KEYSTORE=${xbaKeystore}: no such file")
if (xbaKeystore && !xbaKeystorePassword)
    throw new GradleException('XBA_KEYSTORE is set but XBA_KEYSTORE_PASSWORD is empty')
def xbaRequireReleaseKey = ((findProperty('xbaRequireReleaseKey') ?: '0') as String) == '1'
def xbaDebuggable = ((findProperty('xbaDebuggable') ?: '0') as String) == '1'
gradle.taskGraph.whenReady { graph ->
    if (xbaKeystore || !graph.allTasks.any { it.project == project && it.name ==~ /(assemble|package|bundle)Release/ })
        return
    if (xbaRequireReleaseKey)
        throw new GradleException('-PxbaRequireReleaseKey=1: no release keystore (XBA_KEYSTORE, XBA_KEYSTORE_PASSWORD)')
    logger.warn('''
        |################################################################################################
        |# RELEASE BUILD SIGNED WITH THE DEBUG KEY: no XBA_KEYSTORE / XBA_KEYSTORE_PASSWORD.             #
        |# This APK cannot update an install signed with the release key (and vice versa) without an    #
        |# uninstall, which deletes the app's data (packs, saves, settings). docs/android/toolchain.md.   #
        |################################################################################################'''
        .stripMargin())
}
// -PxbaJobs=N caps the native build's parallel compiles and links (Ninja job pools); unset = Ninja's default
// (all cores). The CI sets it: its host also serves Gitea and Plane.
def xbaJobs = ((findProperty('xbaJobs') ?: '') as String).trim()
if (xbaJobs && !(xbaJobs ==~ /[1-9][0-9]*/)) throw new GradleException("-PxbaJobs=${xbaJobs}: expected a positive number")

def repoRoot = rootProject.file('..')
def xbaCommit = providers.exec {
    commandLine 'git', '-C', repoRoot.path, 'rev-parse', 'HEAD'
    ignoreExitValue = true
}.standardOutput.asText.map { it.trim() ?: 'unknown' }
def toolkitAsset = xbaToolchainDir ? tasks.register('xbaToolkitAsset', XbaToolkitAsset) {
    it.repoRoot = repoRoot.path
    // docs/android/prepare.md « Toolkit tree »: the pipeline (Python only: no tests, caches or per-game output),
    // the title template and profiles, and the headers the generated C includes. The patterns are in
    // tools/prepare/toolkit_tree.json, so that tools/prepare/toolkit.py hashes the same files on a host.
    def tree = new groovy.json.JsonSlurper().parse(new File(repoRoot, 'tools/prepare/toolkit_tree.json'))
    tree.trees.each { t ->
        it.toolkitFiles.from(fileTree(repoRoot) {
            include t.include
            exclude t.exclude
            exclude tree.exclude_everywhere
        })
    }
    it.commit = xbaCommit
} : null

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.sources.assets?.addGeneratedSourceDirectory(selftestAsset, XbaSelftestAsset::getOutputDir)
        variant.sources.assets?.addGeneratedSourceDirectory(licencesAsset, XbaLicencesAsset::getOutputDir)
        if (x360KeyAsset) variant.sources.assets?.addGeneratedSourceDirectory(x360KeyAsset, XbaX360KeyAsset::getOutputDir)
        if (toolkitAsset) variant.sources.assets?.addGeneratedSourceDirectory(toolkitAsset, XbaToolkitAsset::getOutputDir)
        if (ps1BiosAsset) variant.sources.assets?.addGeneratedSourceDirectory(ps1BiosAsset, XbaPs1BiosAsset::getOutputDir)
    }
}

android {
    namespace 'fr.adserver.xrecomp'
    compileSdk 35
    ndkVersion '28.2.13676358'

    defaultConfig {
        applicationId findProperty('xbaApplicationId') ?: 'fr.adserver.xrecomp.shell'
        minSdk 30                       // decision XBA-10
        targetSdk 35
        versionCode((findProperty('xbaVersionCode') ?: '1') as int)
        versionName xbaVersion
        resValue 'string', 'app_name', (findProperty('xbaLabel') ?: 'XRecomp')
        resValue 'string', 'xba_xbe_sha256', xbaXbeSha256
        // Shown on the launcher's About screen (XBA-41).
        resValue 'string', 'xba_version', xbaVersion
        resValue 'string', 'xba_version_code', (findProperty('xbaVersionCode') ?: '1') as String
        // The launcher offers Frame generation and « Choose Lossless.dll » only when the bridge is in libmain.so: with
        // frame generation on, CMake builds it or fails (no silent build without it).
        resValue 'bool', 'xba_lsfg', xbaLsfg ? 'true' : 'false'
        // Cloud saves (docs/android/app-shell.md « Cloud saves »): the project's Google OAuth client, of type « TVs and
        // Limited Input devices » (GoogleDrive.java). -PxbaGoogleClientId / -PxbaGoogleClientSecret, or the env
        // XBA_GOOGLE_CLIENT_ID / XBA_GOOGLE_CLIENT_SECRET (CI: BuildKit secrets, never in the repository). An installed
        // app's client secret is not confidential (it ships in the APK), but it stays out of the public repo. Empty:
        // the build has no cloud saves (the row says so).
        resValue 'string', 'xba_google_client_id',
                 ((findProperty('xbaGoogleClientId') ?: System.getenv('XBA_GOOGLE_CLIENT_ID') ?: '') as String).trim()
        resValue 'string', 'xba_google_client_secret',
                 ((findProperty('xbaGoogleClientSecret') ?: System.getenv('XBA_GOOGLE_CLIENT_SECRET') ?: '') as String).trim()
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments "-DXBOXRECOMP_SDL2_SOURCE_DIR=${sdl2Src}", "-DXBA_VERSION=${xbaVersion}",
                          '-DXBOXRECOMP_BUILD_TESTS=OFF', "-DXBA_TITLE_DIR=${xbaTitleDir}",
                          // Release only: -mcpu for the runtime libraries (cpp/CMakeLists.txt); empty = arm64 baseline.
                          "-DXBA_NATIVE_CPU=${findProperty('xbaNativeCpu') ?: ''}",
                          "-DXBOXRECOMP_LSFG=${xbaLsfg ? 'ON' : 'OFF'}",
                          "-DXBA_FFMPEG_DIR=${xbaFfmpegDir}",
                          "-DXBOXRECOMP_LSFG_VK_SRC=${lsfgVkSrc}", "-DXBOXRECOMP_LSFG_DXVK_SRC=${dxvkSrc}"
                if (xbaJobs)
                    arguments "-DCMAKE_JOB_POOLS=xba_jobs=${xbaJobs}", '-DCMAKE_JOB_POOL_COMPILE=xba_jobs',
                              '-DCMAKE_JOB_POOL_LINK=xba_jobs'
            }
        }
    }

    sourceSets.main.java.srcDirs += "${sdl2Src}/android-project/app/src/main/java"
    if (xbaIconRes) {
        sourceSets.debug.res.srcDirs += xbaIconRes
        sourceSets.release.res.srcDirs += xbaIconRes
    }

    // libavcodec.so and libavutil.so, the Xbox 360's XMA decoder (XBA-299, tools/android/build_ffmpeg.sh)
    if (xbaFfmpegDir)
        sourceSets.main.jniLibs.srcDirs += "${xbaFfmpegDir}/jniLibs"

    if (xbaToolchainDir) {
        sourceSets.main.jniLibs.srcDirs += "${xbaToolchainDir}/jniLibs"
        sourceSets.main.assets.srcDirs += "${xbaToolchainDir}/assets"     // prepare/python-stdlib.zip, sysroot.zip
        // (Exec'd from nativeLibraryDir: extracted at install, packagingOptions below.)
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.6'
        }
    }

    // The release key (XBA-125, docs/android/toolchain.md « Signing »): a keystore that never enters the repository
    // or an image. XBA_KEYSTORE (or -PxbaKeystore) is its path, XBA_KEYSTORE_PASSWORD its password, XBA_KEY_ALIAS the
    // key (default xrecomp), XBA_KEY_PASSWORD the key's password (default: the store's, as in a PKCS12 keystore).
    // In CI they come from repository secrets through BuildKit secret mounts (the xrecomp-apk stage). Without them a
    // release build is signed with the debug key, and says so loudly: such an APK cannot update a release-signed
    // install. -PxbaRequireReleaseKey=1 makes the missing key an error instead.
    if (xbaKeystore) {
        signingConfigs {
            xbaRelease {
                storeFile file(xbaKeystore)
                storePassword xbaKeystorePassword
                keyAlias(System.getenv('XBA_KEY_ALIAS') ?: 'xrecomp')
                keyPassword(System.getenv('XBA_KEY_PASSWORD') ?: xbaKeystorePassword)
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig xbaKeystore ? signingConfigs.xbaRelease : signingConfigs.debug
            // -PxbaDebuggable=1 (the CI's XRecomp APK): optimised native code, but `adb shell run-as` still works,
            // which the device check lists and the data export of the signing switch rely on.
            debuggable xbaDebuggable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The on-device Prepare (docs/android/prepare.md) execs libxbapython.so and libxbacc.so from nativeLibraryDir and
    // passes libmain.so to the linker: the native libraries must be extracted at install (extractNativeLibs).
    packagingOptions {
        jniLibs { useLegacyPackaging = true }
    }

    lint { abortOnError false }

    // JVM unit tests (Robolectric) of the launcher and the Prepare service: android/app/src/test, run with
    // `gradle testDebugUnitTest -x externalNativeBuildDebug` (tools/docker/android.Dockerfile, target app-unit-tests).
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                systemProperty 'robolectric.graphicsMode', 'NATIVE'
                systemProperty 'xba.screenshots', "${buildDir}/screenshots"
                // The launcher's How it works shows once on a first start; every test but LauncherGuideTest starts past it.
                systemProperty 'xba.guide', 'seen'
                maxHeapSize = '2g'
                // The assertion's message in the CI log, not just its line: a failure seen
                // only on the loaded CI host must say what it saw.
                testLogging {
                    events 'failed'
                    exceptionFormat 'full'
                }
                // Robolectric fetches its android-all jars from Maven Central at the first run; another repository
                // (a mirror of Central) with -ProbolectricRepoUrl=...
                if (findProperty('robolectricRepoUrl'))
                    systemProperty 'robolectric.dependency.repo.url', findProperty('robolectricRepoUrl')
                // ThemePreviewTest (opt-in): the launcher in the theme of a game of your own, build/screenshots/preview-*
                if (findProperty('xbaPreviewGameDir'))
                    systemProperty 'xba.previewGameDir', findProperty('xbaPreviewGameDir')
            }
        }
    }
}

// The app uses no AndroidX and one library: apksig, which signs the game apps « Create an app » makes on the device
// (TitleApk; docs/android/app-shell.md « A game's own app »). APK Signature Scheme v2 is a binary format with
// exact digest rules that the platform's verifier must accept; AOSP's own signer (Apache-2.0, pure Java, no
// dependencies, the code apksigner and AGP use) is safer than a home-made one. The version is AGP's, already in the
// Gradle cache of the build images (NOTICE « The Android app », LICENSES/Apache-2.0-apksig.txt).
// The rest is test-only (Robolectric brings test-only AndroidX).
dependencies {
    implementation 'com.android.tools.build:apksig:8.7.3'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
