# Desktop downloads on the public GitHub mirror (docs/releases/README.md « What a release contains »): the Mac app,
# the Linux toolkit (x86-64 and arm64, XBA-87) and the Windows toolkit (x86-64, experimental, XBA-89), built on
# GitHub's own runners (free for a public repository; nothing runs on the maintainers' machines) and attached to the
# GitHub release that Gitea's CI publishes with the APK.
#
#   tag xrecomp-v<version>   <tag>-macos-arm64.zip, <tag>-linux-x86_64.tar.gz, <tag>-linux-arm64.tar.gz and
#                            <tag>-windows-x86_64.zip on that release
#   push to main             the same named xrecomp-<sha8>-… on xrecomp-latest
#   manual run               the same for the ref it runs on (a tag or main); any other branch builds without
#                            publishing (the files stay on the run's page)
#
# Gitea ignores .github/workflows while .gitea/workflows exists. No game, no game data, no generated C: each download
# is this repository's tree at the commit (tools/ci/package_toolkit.sh) with the pinned frame generation source tarballs
# (lsfg-vk framegen, volk, DXVK, SPIRV-Headers: built by default, XBA-187), plus XRecomp.app for the Mac, and the
# prebuilt runtime of its host (runtime/<host>/, tools/prepare/runtime.py, XBA-86): prepare then builds a title with a
# C compiler alone, no CMake (tools/prepare/desktop_build.py); with it, in runtime/<host>/bin/, the console players
# (gba_play, ps1_play, n64_play) that ./xrecomp play starts. Each Linux archive is built and smoke-tested on its own
# architecture (GitHub's ubuntu-24.04 and ubuntu-24.04-arm runners), so its runtime matches Ubuntu 24.04's libraries.
# No pull request runs this (pushes to main, tags, manual runs only).
#
# Order with Gitea: tools/ci/github_release.sh deletes and recreates a release (the APK side), which would drop files
# attached before it. So the publish job waits for the release of this very commit (target_commitish), then attaches.
# A re-run of Gitea's release job drops these files: re-run this workflow's run for the tag afterwards.
name: Desktop

on:
  push:
    branches: [main]
    tags: ['xrecomp-v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      label: ${{ steps.m.outputs.label }}
      release: ${{ steps.m.outputs.release }}
      version: ${{ steps.m.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: m
        run: |
          sha8=$(printf '%s' "$GITHUB_SHA" | cut -c1-8)
          last=$(git describe --tags --match 'xrecomp-v*' --abbrev=0 2>/dev/null || echo xrecomp-v0.1.0)
          case "$GITHUB_REF" in
            refs/tags/xrecomp-v*) tag=${GITHUB_REF#refs/tags/}
                                  label=$tag release=$tag version=${tag#xrecomp-v} ;;
            refs/heads/main)      label=xrecomp-$sha8 release=xrecomp-latest version=${last#xrecomp-v} ;;
            *)                    label=xrecomp-$sha8 release="" version=${last#xrecomp-v} ;;
          esac
          { echo "label=$label"; echo "release=$release"; echo "version=$version"; } >> "$GITHUB_OUTPUT"
          echo "label $label, release ${release:-none (not published)}, app version $version"

  macos:
    needs: meta
    runs-on: macos-15
    timeout-minutes: 45
    env:
      LABEL: ${{ needs.meta.outputs.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Launcher checks (build, xrecomp-check, smoke)
        run: bash macos/scripts/check.sh
      - name: XRecomp.app inside the toolkit folder
        env:
          XBA_APP_VERSION: ${{ needs.meta.outputs.version }}
          XBA_APP_PORTABLE: '1'
        run: |
          sh tools/ci/package_toolkit.sh out/XRecomp
          # The prebuilt runtime (XBA-86): SDL2 and libepoxy as tools/macos/setup.sh installs them.
          brew install pkgconf sdl2-compat libepoxy ninja
          python3 -m tools.prepare.runtime --toolkit out/XRecomp
          bash macos/scripts/build-app.sh
          ditto macos/build/XRecomp.app out/XRecomp/XRecomp.app
          codesign --verify --strict out/XRecomp/XRecomp.app
          ! /usr/libexec/PlistBuddy -c 'Print :XBAToolkitPath' out/XRecomp/XRecomp.app/Contents/Info.plist 2>/dev/null
      - name: The packaged app finds its toolkit by itself
        run: |
          t=$(mktemp -d)
          mkdir -p "$t/library/Synthetic Game" "$t/home"
          cp tools/conformance/test.xbe "$t/library/Synthetic Game/default.xbe"
          XRECOMP_HOME="$t/home" out/XRecomp/XRecomp.app/Contents/MacOS/XRecomp --smoke --library "$t/library" \
            | tee "$t/smoke.json"
          grep -Eq '"toolkit_source" *: *"bundle"' "$t/smoke.json"
          grep -Eq '"toolkit" *: *"[^"]*/out/XRecomp"' "$t/smoke.json"
      - name: Zip
        run: |
          ditto -c -k --keepParent out/XRecomp "out/$LABEL-macos-arm64.zip"
          (cd out && shasum -a 256 "$LABEL-macos-arm64.zip" > "$LABEL-macos-arm64.zip.sha256" && cat ./*.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: out/${{ env.LABEL }}-macos-arm64.zip*
          retention-days: 14

  linux:
    needs: meta
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      ARCHIVE: ${{ needs.meta.outputs.label }}-linux-${{ matrix.arch }}.tar.gz
    steps:
      - uses: actions/checkout@v4
      - name: Package
        run: |
          sh tools/ci/package_toolkit.sh out/XRecomp
          # The prebuilt runtime for linux-<arch> and the console players (XBA-86, XBA-87), built against the
          # packages install_deps.sh installs.
          bash tools/linux/install_deps.sh
          sudo apt-get install -y ninja-build
          python3 -m tools.prepare.runtime --toolkit out/XRecomp
          test -f "out/XRecomp/runtime/linux-${{ matrix.arch }}/runtime.json"
          tar -C out -czf "out/$ARCHIVE" XRecomp
          (cd out && sha256sum "$ARCHIVE" > "$ARCHIVE.sha256" && cat ./*.sha256)
      # From the archive, as a user would (docs/desktop/cli.md « Install »; the venv because Ubuntu's pip refuses system installs):
      # ./xrecomp prepare of the synthetic retail XBE without CMake, the title started headless, the three console
      # players through ./xrecomp play, then the runtime's CMake build with frame generation (XBA-187).
      - name: Smoke test of the archive
        run: |
          t=$(mktemp -d)
          tar -C "$t" -xzf "out/$ARCHIVE" XRecomp/tools/linux/install_deps.sh
          bash "$t/XRecomp/tools/linux/install_deps.sh"
          sudo apt-get install -y python3-venv
          python3 -m venv "$t/venv" && "$t/venv/bin/pip" install -q capstone pefile numpy
          PYTHON="$t/venv/bin/python" sh tools/ci/smoke_linux_package.sh "out/$ARCHIVE" --cmake
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: out/${{ env.ARCHIVE }}*
          retention-days: 14

  # Windows x86-64, experimental (XBA-89; docs/desktop/windows.md): the runtime built with MSVC (upstream's reference
  # compiler; clang-cl when cl fails, with a warning), the toolkit, xrecomp.cmd. Smoke test from the zip as a user
  # would: the synthetic retail XBE prepared by the compile driver (clang-cl + lld-link when LLVM is on PATH, else cl;
  # then cl explicitly) and started until « XBE loaded » (Win32 + D3D11: no SDL on Windows). Xbox games only: the
  # console runtimes are POSIX-only. Its failure does not hold back the macOS and Linux files (publish below).
  windows:
    needs: meta
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      LABEL: ${{ needs.meta.outputs.label }}
      PYTHONUTF8: '1'
    defaults:
      run:
        shell: bash
    steps:
      # The files as git has them (LF), so the package hashes and the scripts are those of the other hosts.
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # cl, link and the Windows SDK (INCLUDE, LIB) for x64, for this job's steps.
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Tools
        run: |
          python -m pip install -q ninja capstone pefile numpy pytest
          set -x
          python --version; cmake --version | head -1; ninja --version
          command -v cl clang-cl lld-link || true
          cl 2>&1 | head -1 || true
          clang-cl --version 2>&1 | head -1 || true
      - name: Package (runtime/windows-x86_64 with MSVC)
        run: |
          sh tools/ci/package_toolkit.sh out/XRecomp
          if ! python -m tools.prepare.runtime --toolkit out/XRecomp -- -DCMAKE_C_COMPILER=cl; then
            echo "::warning::the Windows runtime does not build with MSVC's cl (log above); building it with clang-cl"
            python -m tools.prepare.runtime --toolkit out/XRecomp -- -DCMAKE_C_COMPILER=clang-cl
          fi
          cat out/XRecomp/runtime/windows-x86_64/runtime.json
          ls out/XRecomp/runtime/windows-x86_64/lib
          (cd out && python -m zipfile -c "$LABEL-windows-x86_64.zip" XRecomp)
          (cd out && sha256sum "$LABEL-windows-x86_64.zip" > "$LABEL-windows-x86_64.zip.sha256" && cat ./*.sha256)
      - name: Smoke test of the zip (prepare with the compile driver, run until « XBE loaded »)
        run: |
          t="$(cygpath -m "$RUNNER_TEMP")/smoke"
          mkdir -p "$t/game" "$t/nocmake"
          python -m zipfile -e "out/$LABEL-windows-x86_64.zip" "$t"
          cd "$t/XRecomp"
          python tools/conformance/mkxbe.py --retail "$t/game/default.xbe"
          # A cmake that fails comes first on PATH: the prebuilt runtime must be enough.
          printf '@echo cmake must not run 1>&2\r\n@exit /b 99\r\n' > "$t/nocmake/cmake.cmd"
          nocmake=$(cygpath -u "$t/nocmake")
          export PATH="$nocmake:$PATH"
          if ! python -m tools.prepare "$t/game/default.xbe" --work "$t/work" > "$t/prepare.log" 2>&1; then
            cat "$t/prepare.log"; echo "--- prepare.log of the work folder"; tail -n 80 "$t/work/prepare.log" || true
            exit 1
          fi
          cat "$t/prepare.log"
          grep -q 'compile driver:' "$t/prepare.log"
          exe="$t/work/project/build/title_12345678.exe"
          ls -la "$(dirname "$exe")"
          # From the build folder: the title reads game/default.xbe beside it (xrecomp play does the same).
          (cd "$(dirname "$exe")" && timeout 30 ./title_12345678.exe > "$t/run.log" 2>&1; echo "exit $?" >> "$t/run.log") || true
          cat "$t/run.log"
          grep -q 'XBE loaded' "$t/run.log"
      - name: The command line (xrecomp.cmd) over the same source
        shell: pwsh
        run: |
          $t = "$env:RUNNER_TEMP\smoke"
          $x = "$t\XRecomp\xrecomp.cmd"
          & $x --home "$t\home" prepare "$t\game" --no-build
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Test-Path "$t\home\titles\12345678\work\project\src\recomp\gen\recomp_dispatch.c")) { exit 1 }
          $list = & $x --home "$t\home" list
          $list
          if (-not ($list -match '^12345678 ')) { exit 1 }
          # A console game's native pack is refused on Windows, with the reason (XBA-278: it plays in the interpreter).
          python -c "import sys; sys.path.insert(0, r'$t\XRecomp'); from tools.prepare.test_gba_prepare import make_rom; open(r'$t\t.gba', 'wb').write(make_rom())"
          $out = & $x --home "$t\home" prepare "$t\t.gba" 2>&1 | Out-String
          $out
          if ($LASTEXITCODE -eq 0 -or -not ($out -match 'not prepared on Windows')) { exit 1 }
          exit 0
      - name: The same title with MSVC's cl (informative)
        continue-on-error: true
        run: |
          t="$(cygpath -m "$RUNNER_TEMP")/smoke"
          cd "$t/XRecomp"
          python -m tools.prepare "$t/game/default.xbe" --work "$t/work-cl" --cc cl > "$t/prepare-cl.log" 2>&1 \
            || { cat "$t/prepare-cl.log"; tail -n 80 "$t/work-cl/prepare.log"; exit 1; }
          grep 'compile driver:' "$t/prepare-cl.log"
          cd "$t/work-cl/project/build"
          (timeout 30 ./title_12345678.exe > run.log 2>&1) || true
          cat run.log
          grep -q 'XBE loaded' run.log
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/${{ env.LABEL }}-windows-x86_64.zip*
          retention-days: 14

  publish:
    needs: [meta, macos, linux, windows]
    # Windows is experimental: its failure leaves its zip out, not the others.
    if: always() && needs.meta.outputs.release != '' && needs.macos.result == 'success' && needs.linux.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE: ${{ needs.meta.outputs.release }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # Gitea publishes the release once its own CI is through (minutes for a tag, up to hours for main behind the
      # shared host's heavy-job lock). For main, no release of this commit in time (a newer push, a red Gitea run)
      # is not an error: the files stay on this run's page.
      - name: Wait for the release of this commit
        id: wait
        run: |
          for _ in $(seq 1 106); do
            target=$(gh release view "$RELEASE" --json targetCommitish -q .targetCommitish 2>/dev/null || true)
            case "$RELEASE:$target" in
              xrecomp-latest:"$GITHUB_SHA") echo "ok=1" >> "$GITHUB_OUTPUT"; exit 0 ;;
              xrecomp-latest:*) ;;
              *:?*) echo "ok=1" >> "$GITHUB_OUTPUT"; exit 0 ;;
            esac
            echo "release $RELEASE: ${target:-not there yet}, waiting for $GITHUB_SHA"
            sleep 180
          done
          if [ "$RELEASE" = xrecomp-latest ]; then
            echo "::warning::no xrecomp-latest release for $GITHUB_SHA: files left on this run only"
            exit 0
          fi
          echo "no release $RELEASE on GitHub: did Gitea's release job run?"; exit 1
      - name: Attach the desktop downloads
        if: steps.wait.outputs.ok == '1'
        run: |
          ls -la out
          gh release upload "$RELEASE" out/* --clobber
          gh release view "$RELEASE" --json body -q .body > body.md
          if ! grep -q '^### Desktop' body.md; then
            cat >> body.md <<'EOF'

          ### Desktop

          - `*-macos-arm64.zip`: the XRecomp app for Macs with Apple silicon (macOS 14+) in the toolkit folder it drives.
            Keep `XRecomp.app` inside that folder. It is not notarized: before the first launch, run
            `xattr -dr com.apple.quarantine <the XRecomp folder>` in Terminal (otherwise macOS blocks the app, or
            runs it from a copy that cannot see its toolkit). Setup lists the Homebrew packages and Python it needs.
          - `*-linux-x86_64.tar.gz`, `*-linux-arm64.tar.gz`: the toolkit for Linux, with its prebuilt runtime and the
            GBA / PS1 / N64 players: `bash tools/linux/install_deps.sh`, then `./xrecomp prepare /path/to/game.iso`,
            `./xrecomp play <game>` (docs/desktop/cli.md « Install »).
          EOF
            if ls out/*-windows-x86_64.zip >/dev/null 2>&1; then
              cat >> body.md <<'EOF'
          - `*-windows-x86_64.zip` (experimental, Xbox games only): the toolkit for Windows 10/11 x86-64. Python 3 and
            Visual Studio's Build Tools (C++), then `xrecomp.cmd prepare C:\path\to\game.iso` and
            `xrecomp.cmd play <game>` (docs/desktop/windows.md).
          EOF
            fi
            cat >> body.md <<'EOF'

          No game inside: you prepare your own games on your computer.
          EOF
            gh release edit "$RELEASE" --notes-file body.md
          fi
          gh release view "$RELEASE" --json assets -q '.assets[].name'
