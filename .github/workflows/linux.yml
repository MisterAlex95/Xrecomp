# The public GitHub mirror's check: the Linux build and every test (tools/docker/linux.Dockerfile, the same as the
# linux job of .gitea/workflows/ci.yml). Gitea ignores .github/workflows while .gitea/workflows exists, so this runs
# only on GitHub: on what the mirror pushes, and on pull requests, which never touch the maintainers' machine here.
# Three parallel jobs (the Dockerfile's PART): the root build + ctest + pytest, and the C test projects in two slices.
# Together they are what PART=all runs on Gitea. gba-corpus is the GBA half of Gitea's homebrew job (XBA-180): the GBA
# homebrew built (devkitARM image), run with the Cult-of-GBA BIOS too, jsmolka's ROMs run (XBA-193), the homebrew
# prepared into packs, run headless, screenshots checked and kept as an artefact. n64-corpus is its N64 half: the N64
# homebrew built (libdragon image) and run through consoles/n64/tests (tools/consoles/run_n64_homebrew.sh).
# ps1-corpus is its PS1 half (XBA-200): the PS1 homebrew built (PSn00bSDK image), OpenBIOS built and ps1-tests fetched
# (tools/consoles/ps1_test_inputs.sh), the whole consoles/ps1/tests ctest run (tools/consoles/run_ps1_tests.sh).
name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: [python, c-1/2, c-2/2]
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (Docker)
        run: |
          set -o pipefail
          # Failed C tests become annotations (run_c_tests.sh's "XBR-FAIL" lines): readable without a GitHub login.
          docker build -f tools/docker/linux.Dockerfile --target test --build-arg PART="${{ matrix.part }}" \
            --progress=plain -t xrecomp-linux . 2>&1 | tee build.log || {
            rc=$?
            grep -o 'XBR-FAIL .*' build.log | sed 's/^XBR-FAIL //' | awk -F': ' '{ m[$1] = m[$1] "%0A" substr($0, length($1) + 3) }
              END { for (p in m) print "::error title=" p "::" substr(m[p], 4) }' | head -n 10
            exit $rc; }
      - name: Test report
        if: always()
        run: |
          docker run --rm xrecomp-linux sh -c 'cat /reports/c-tests.md 2>/dev/null; tail -n 3 /reports/pytest.txt 2>/dev/null; grep -E "Hits|Misses" /reports/ccache.txt 2>/dev/null | head -2' \
            >> "$GITHUB_STEP_SUMMARY" || true

  gba-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the GBA homebrew corpus
        run: JOBS=4 bash tools/consoles/build_homebrew.sh gba out/homebrew
      - name: GBA test inputs (Cult-of-GBA BIOS, jsmolka/gba-tests)
        run: bash tools/consoles/gba_test_inputs.sh out/gba-inputs
      - name: GBA corpus as recompiled packs (Prepare, headless run, screenshots)
        run: JOBS=4 bash tools/consoles/run_gba_packs.sh out/homebrew out/gba-packs out/gba-inputs
      - name: Report
        if: always()
        run: cat out/gba-packs/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gba-corpus-screens
          path: |
            out/gba-packs/*.png
            out/gba-packs/*.log
            out/gba-packs/report.md
            out/gba-packs/SHA256SUMS
          if-no-files-found: ignore

  n64-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the N64 homebrew corpus
        run: JOBS=4 bash tools/consoles/build_homebrew.sh n64 out/homebrew
      - name: N64 corpus through the runtime's ctest (interpreter, recompiled in lockstep, states, rewind)
        run: JOBS=4 bash tools/consoles/run_n64_homebrew.sh out/homebrew out/n64-homebrew
      - name: Report
        if: always()
        run: tail -n 40 out/n64-homebrew/ctest.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  ps1-corpus:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build the PS1 homebrew corpus
        run: JOBS=4 bash tools/consoles/build_homebrew.sh ps1 out/homebrew
      - name: PS1 test inputs (OpenBIOS, JaCzekanski/ps1-tests)
        run: bash tools/consoles/ps1_test_inputs.sh out/ps1-inputs
      - name: PS1 tests (homebrew, ps1-tests, OpenBIOS + HLE, recompiled in lockstep, states, lockref)
        run: JOBS=4 bash tools/consoles/run_ps1_tests.sh out/homebrew out/ps1-tests out/ps1-inputs
      - name: Report
        if: always()
        run: tail -n 40 out/ps1-tests/ctest.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
