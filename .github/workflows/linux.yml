# The public GitHub mirror's check: the Linux build and every test (tools/docker/linux.Dockerfile, the same as the
# linux job of .gitea/workflows/ci.yml). Gitea ignores .github/workflows while .gitea/workflows exists, so this runs
# only on GitHub: on what the mirror pushes, and on pull requests, which never touch the maintainers' machine here.
name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Build and test (Docker)
        run: docker build -f tools/docker/linux.Dockerfile --target test --progress=plain -t xrecomp-linux .
      - name: C test report
        if: always()
        run: docker run --rm xrecomp-linux cat /reports/c-tests.md >> "$GITHUB_STEP_SUMMARY" || true
